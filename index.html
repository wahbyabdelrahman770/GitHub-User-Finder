<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>github user finder</title>

    <link rel="icon" href="Media/icon.png">
    <link rel="stylesheet" href="CSS/modified-bootstrap.css">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body class="bg-body-secondary d-flex flex-column align-items-center">

    <div class="w-90 mx-auto d-flex flex-column align-items-center row-gap-3">
        <div class="black-circle rounded-circle bg-black"></div>
        <h1 class="text-center">GitHub User Finder</h1>
        <p class="fw-normal text-secondary text-center">Search for any GitHub user by their username</p>
    </div>

    <div class="input-buttons w-50 bg-body mt-3 p-3 rounded-3 d-flex flex-column row-gap-3">
        <div class="w-100 d-flex flex-column flex-lg-row justify-content-center align-items-center row-gap-1">
            <input type="text" placeholder="Enter GitHub Username..." class="w-70 py-1 px-2 form-control">
            <button disabled class="showBtn w-20 btn btn-primary p-1 text-center">Show</button>
            <button disabled class="clearBtn w-10 btn btn-danger p-1 text-center">Clear</button>
        </div>

        <div class="loading bg-primary text-light text-center p-2 rounded-3 d-none"></div>

        <div class="error w-100 rounded-3 text-center p-2 bg-danger text-light d-none"></div>
    </div>

    <div class="w-50 result rounded-5 my-4 px-1 py-3 py-lg-4 bg-dark d-none flex-column align-items-center row-gap-2">
    </div>

    <script src="JS/script.js"></script>
</body>
</html>
