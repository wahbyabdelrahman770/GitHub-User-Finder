<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>github user finder</title>

    <link rel="icon" href="Media/icon.png">
    <link rel="stylesheet" href="CSS/modified-bootstrap.css">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body class="bg-body-secondary d-flex flex-column align-items-center">

    <div class="d-flex flex-column align-items-center row-gap-3">
        <div class="black-circle rounded-circle bg-black"></div>
        <h1>GitHub User Finder</h1>
        <p class="fw-normal text-secondary">Search for any GitHub user by their username</p>
    </div>

    <div class="w-50 bg-body mt-3 p-3 rounded-3 d-flex flex-column row-gap-3">
        <div class="w-100 d-flex flex-row justify-content-center">
            <input type="text" placeholder="Enter GitHub Username..." class="w-70 p-2 form-control">
            <button disabled class="w-20 btn btn-primary">Show</button>
            <button disabled class="w-10 btn btn-danger">Clear</button>
        </div>

        <div class="loading bg-primary text-light text-center p-2 rounded-3 d-none"></div>

        <div class="error w-100 rounded-3 text-center p-2 bg-danger text-light d-none"></div>
    </div>

    <div class="w-50 result rounded-5 my-4 p-4 bg-dark d-none flex-column align-items-center row-gap-2"></div>

    <script src="JS/script.js"></script>
</body>
</html>
